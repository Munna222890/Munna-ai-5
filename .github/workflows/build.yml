          cat > 'app/src/main/java/com/personal/ai/WebTools.kt' <<'__EOF__'
          package com.personal.ai

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.text.Html
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          /** ইন্টারনেট থাকলে তথ্য আনার টুল। */
          object Web {
              private val prefixes = listOf(
                  "সার্চ", "search", "খুঁজো", "খুঁজে", "খোঁজ", "নেট থেকে", "ইন্টারনেট থেকে", "গুগল"
              )
              private val words = listOf(
                  "খবর", "news", "আবহাওয়া", "weather", "দাম কত", "price", "স্কোর", "score", "সর্বশেষ", "latest", "আজকের"
              )

              fun wantsWeb(text: String): Boolean {
                  val t = text.lowercase().trim()
                  return prefixes.any { t.startsWith(it) } || words.any { t.contains(it) }
              }

              fun stripPrefix(text: String): String {
                  var t = text.trim()
                  for (p in prefixes) {
                      if (t.lowercase().startsWith(p)) {
                          t = t.substring(p.length).trim()
                          break
                      }
                  }
                  return t
              }

              fun isOnline(ctx: Context): Boolean {
                  val cm = ctx.getSystemService(ConnectivityManager::class.java) ?: return false
                  val net = cm.activeNetwork ?: return false
                  val caps = cm.getNetworkCapabilities(net) ?: return false
                  return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET) &&
                      caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)
              }

              private fun get(url: String): String {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 10000
                  c.readTimeout = 12000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 15) Mobile")
                  return c.inputStream.bufferedReader().use { it.readText() }
              }

              private fun clean(s: String): String =
                  Html.fromHtml(s, Html.FROM_HTML_MODE_LEGACY).toString().trim()

              private fun enc(s: String) = URLEncoder.encode(s, "UTF-8")

              /** ব্লকিং কল — ব্যাকগ্রাউন্ড থ্রেডে চালাতে হবে। */
              fun search(query: String, city: String = "Dhaka"): String {
                  val out = ArrayList<String>()
                  val q = query.lowercase()
                  if (q.contains("আবহাওয়া") || q.contains("weather") || q.contains("তাপমাত্রা")) {
                      try {
                          val w = get("https://wttr.in/${enc(city)}?format=%25C+%25t+humidity+%25h+wind+%25w").trim()
                          out.add("আবহাওয়া ($city): $w")
                      } catch (_: Exception) {
                      }
                  }
                  try {
                      val page = get("https://html.duckduckgo.com/html/?q=${enc(query)}")
                      val titles = Regex("class=\"result__a\"[^>]*>(.*?)</a>", RegexOption.DOT_MATCHES_ALL)
                          .findAll(page).map { clean(it.groupValues[1]) }.toList()
                      val snips = Regex("class=\"result__snippet\"[^>]*>(.*?)</a>", RegexOption.DOT_MATCHES_ALL)
                          .findAll(page).map { clean(it.groupValues[1]) }.toList()
                      for (i in 0 until minOf(titles.size, snips.size, 5)) {
                          out.add("${titles[i]}: ${snips[i]}")
                      }
                  } catch (_: Exception) {
                  }
                  if (out.size < 2) {
                      for (lang in listOf("bn", "en")) {
                          try {
                              val u = "https://$lang.wikipedia.org/w/api.php?action=query&list=search&format=json" +
                                  "&srlimit=3&srsearch=${enc(query)}"
                              val arr = JSONObject(get(u)).getJSONObject("query").getJSONArray("search")
                              for (i in 0 until arr.length()) {
                                  val it = arr.getJSONObject(i)
                                  out.add("${it.getString("title")}: ${clean(it.getString("snippet"))}")
                              }
                          } catch (_: Exception) {
                          }
                          if (out.isNotEmpty()) break
                      }
                  }
                  val joined = out.joinToString("\n") { "- $it" }
                  return if (joined.length > 1500) joined.substring(0, 1500) else joined
              }
          }
