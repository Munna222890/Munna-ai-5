          package com.personal.ai

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.provider.AlarmClock
          import android.provider.ContactsContract
          import android.provider.Settings
          import android.telephony.SmsManager
          import java.time.LocalDateTime
          import java.time.format.DateTimeFormatter

          /** ফোন কন্ট্রোল: সবই অফলাইনে কাজ করে। */
          class PhoneControl(private val act: Activity) {
              private val prefs = act.getSharedPreferences("ai", Context.MODE_PRIVATE)

              /** নোট বদলালে true হয়, যাতে মডেল নতুন নোট জানতে পারে। */
              var notesChanged = false
              private var torchOn = false

              fun name(): String = prefs.getString("name", "") ?: ""
              fun setName(n: String) {
                  prefs.edit().putString("name", n).apply()
              }

              fun notes(): List<String> =
                  (prefs.getString("notes", "") ?: "").split("\n").filter { it.isNotBlank() }

              private fun saveNotes(l: List<String>) {
                  prefs.edit().putString("notes", l.joinToString("\n")).apply()
                  notesChanged = true
              }

              fun clearNotes() = saveNotes(emptyList())

              private fun norm(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s) {
                      val i = "০১২৩৪৫৬৭৮৯".indexOf(ch)
                      sb.append(if (i >= 0) ('0' + i) else ch)
                  }
                  return sb.toString().trim()
              }

              private fun has(t: String, vararg w: String) = w.any { t.contains(it) }

              private val bnWeekdays = listOf("সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার", "শুক্রবার", "শনিবার", "রবিবার")

              private val aliases = linkedMapOf(
                  "ইউটিউব" to "youtube", "হোয়াটসঅ্যাপ" to "whatsapp", "হোয়াটসএপ" to "whatsapp",
                  "ফেসবুক" to "facebook", "মেসেঞ্জার" to "messenger", "ক্রোম" to "chrome",
                  "ক্যামেরা" to "camera", "সেটিংস" to "settings", "সেটিং" to "settings",
                  "গ্যালারি" to "gallery", "ক্যালকুলেটর" to "calculator", "ঘড়ি" to "clock",
                  "মেসেজ" to "messages", "ম্যাপস" to "maps", "ম্যাপ" to "maps", "জিমেইল" to "gmail",
                  "টেলিগ্রাম" to "telegram", "ইনস্টাগ্রাম" to "instagram", "ইন্সটাগ্রাম" to "instagram",
                  "টিকটক" to "tiktok", "বিকাশ" to "bkash", "নগদ" to "nagad", "ইমো" to "imo",
                  "প্লে স্টোর" to "play store", "ডায়ালার" to "phone", "ফাইল" to "my files"
              )

              val help = """কী কী বলতে পারেন:
          • টর্চ জ্বালাও / টর্চ নিভাও
          • ভলিউম 50 / ভলিউম বাড়াও / ভলিউম কমাও
          • ব্রাইটনেস 70
          • সকাল 6:30 এ অ্যালার্ম দাও / রাত 10টায় অ্যালার্ম
          • 5 মিনিটের টাইমার
          • রাহুলকে কল দাও / কল 017XXXXXXXX
          • sms 017XXXXXXXX কেমন আছো
          • ইউটিউব খোলো (যেকোনো অ্যাপের নাম)
          • ওয়াইফাই খোলো / ব্লুটুথ খোলো
          • ব্যাটারি কত / এখন কয়টা বাজে
          • মনে রাখো আমার জন্মদিন ৫ মার্চ
          • সার্চ ... / আজকের খবর / আবহাওয়া (নেট লাগবে)
          • বাকি সব প্রশ্ন সরাসরি জিজ্ঞেস করুন"""

              private fun need(perm: String): Boolean {
                  if (act.checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED) return true
                  act.requestPermissions(arrayOf(perm), 11)
                  return false
              }

              /** ফোন কমান্ড হলে উত্তর দেয়, নইলে null। */
              fun handle(raw: String): String? {
                  val text = norm(raw)
                  val t = text.lowercase()
                  val nums = Regex("\\d+").findAll(t).mapNotNull { it.value.toLongOrNull() }.toList()

                  if (t == "সাহায্য" || t == "help" || t == "হেল্প") return help

                  // স্মৃতি
                  Regex("^(মনে রাখো|মনে রাখ|remember)[\\s,:]*(.+)", RegexOption.IGNORE_CASE).find(text)?.let {
                      saveNotes(notes() + it.groupValues[2].trim())
                      return "মনে রাখলাম।"
                  }
                  if (has(t, "সব ভুলে যাও", "forget everything")) {
                      clearNotes()
                      return "সব নোট মুছে ফেললাম।"
                  }
                  if (has(t, "কী কী মনে রেখেছ", "কি কি মনে রেখেছ", "my notes")) {
                      val n = notes()
                      return if (n.isEmpty()) "এখনো কিছু মনে রাখিনি।" else n.joinToString("\n") { "• $it" }
                  }

                  // টর্চ চালু থাকলে শুধু "বন্ধ করো / নিভাও" বললেই নিভবে
                  if (torchOn && t.trim() in setOf("বন্ধ করো", "বন্ধ কর", "বন্ধ", "বন্ধ করে দাও", "নিভাও", "নিভিয়ে দাও", "off", "stop", "স্টপ", "থামাও")) {
                      return torch(false)
                  }
                  // টর্চ
                  if (has(t, "টর্চ", "torch", "flashlight", "ফ্ল্যাশলাইট")) {
                      return torch(!has(t, "নিভ", "বন্ধ", "অফ", "off"))
                  }

                  // ভলিউম
                  if (has(t, "ভলিউম", "volume", "আওয়াজ", "সাউন্ড")) {
                      val am = act.getSystemService(AudioManager::class.java)
                      val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      if (nums.isNotEmpty()) {
                          val pct = nums[0].coerceIn(0, 100).toInt()
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.round(pct * max / 100f), AudioManager.FLAG_SHOW_UI)
                          return "ভলিউম $pct% করলাম।"
                      }
                      if (has(t, "বাড়া", "up", "increase")) {
                          repeat(2) { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI) }
                          return "ভলিউম বাড়ালাম।"
                      }
                      if (has(t, "কমা", "down", "decrease")) {
                          repeat(2) { am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI) }
                          return "ভলিউম কমালাম।"
                      }
                      if (has(t, "ফুল", "max")) {
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, max, AudioManager.FLAG_SHOW_UI)
                          return "ভলিউম সর্বোচ্চ করলাম।"
                      }
                  }

                  // ব্রাইটনেস
                  if (has(t, "ব্রাইটনেস", "brightness") && nums.isNotEmpty()) {
                      return brightness(nums[0].coerceIn(0, 100).toInt())
                  }

                  // অ্যালার্ম
                  if (has(t, "অ্যালার্ম", "এলার্ম", "অ্যালারাম", "alarm") && nums.isNotEmpty()) {
                      val m = Regex("(\\d{1,2})\\s*[:.]\\s*(\\d{2})").find(t)
                      var h: Int
                      val mi: Int
                      if (m != null) {
                          h = m.groupValues[1].toInt()
                          mi = m.groupValues[2].toInt()
                      } else {
                          h = nums[0].toInt()
                          mi = if (nums.size > 1) nums[1].toInt() else 0
                      }
                      if (has(t, "বিকাল", "বিকেল", "সন্ধ্যা", "রাত", "pm") && h < 12) h += 12
                      if (h in 0..23 && mi in 0..59) return setAlarm(h, mi)
                  }

                  // টাইমার
                  if (has(t, "টাইমার", "timer") && nums.isNotEmpty()) {
                      val n = nums[0].coerceAtMost(86400)
                      val secs = when {
                          has(t, "ঘণ্টা", "ঘন্টা", "hour") -> n * 3600
                          has(t, "সেকেন্ড", "sec") -> n
                          else -> n * 60
                      }
                      return setTimer(secs.toInt())
                  }

                  // এসএমএস: sms 017... হ্যালো
                  Regex("^sms\\s+(\\+?\\d+)\\s+(.+)", RegexOption.IGNORE_CASE).find(text)?.let {
                      return sendSms(it.groupValues[1], it.groupValues[2])
                  }

                  // কল
                  if (has(t, "কল", "call", "ফোন করো", "ফোন দাও", "ফোন কর")) {
                      val numMatch = Regex("\\+?\\d[\\d\\s-]{6,}\\d").find(text)
                      var number: String? = null
                      var who: String? = null
                      if (numMatch != null) {
                          number = numMatch.value.replace(Regex("[\\s-]"), "")
                          who = number
                      } else if (act.checkSelfPermission(Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED) {
                          val c = findContact(t)
                          if (c != null) {
                              who = c.first
                              number = c.second
                          }
                      } else {
                          act.requestPermissions(arrayOf(Manifest.permission.READ_CONTACTS), 12)
                          return "কনটাক্ট দেখার পারমিশন দিন, তারপর আবার বলুন।"
                      }
                      if (number != null) return call(who ?: number, number)
                  }

                  // ব্যাটারি
                  if (has(t, "ব্যাটারি", "battery", "চার্জ কত")) {
                      val i = act.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                      val level = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                      val scale = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                      val st = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                      val charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                      return if (level < 0) "ব্যাটারির তথ্য পেলাম না।"
                      else "ব্যাটারি ${level * 100 / scale}%, ${if (charging) "চার্জ হচ্ছে" else "চার্জ হচ্ছে না"}।"
                  }

                  // সময়/তারিখ
                  if (has(t, "কয়টা বাজে", "এখন কয়টা", "সময় কত", "what time", "আজকের তারিখ", "আজ কত তারিখ",
                          "what date", "আজ কী বার", "আজ কি বার")) {
                      val n = LocalDateTime.now()
                      return "এখন ${n.format(DateTimeFormatter.ofPattern("hh:mm a"))}, ${bnWeekdays[n.dayOfWeek.value - 1]}, " +
                          "তারিখ ${n.format(DateTimeFormatter.ofPattern("dd-MM-yyyy"))}।"
                  }

                  // ওয়াই-ফাই / ব্লুটুথ (অ্যান্ড্রয়েড সরাসরি অন-অফ করতে দেয় না, প্যানেল খুলে দিই)
                  if (has(t, "ওয়াইফাই", "ওয়াই-ফাই", "wifi", "wi-fi", "ইন্টারনেট সেটিং") &&
                      has(t, "অন", "অফ", "চালু", "বন্ধ", "খোল", "খুল", "on", "off", "open")) {
                      return try {
                          act.startActivity(Intent(Settings.Panel.ACTION_INTERNET_CONNECTIVITY))
                          "ওয়াই-ফাই প্যানেল খুলেছি, সেখান থেকে অন/অফ করুন।"
                      } catch (e: Exception) {
                          "ওয়াই-ফাই প্যানেল খোলা গেল না।"
                      }
                  }
                  if (has(t, "ব্লুটুথ", "bluetooth") &&
                      has(t, "অন", "অফ", "চালু", "বন্ধ", "খোল", "খুল", "on", "off", "open")) {
                      return try {
                          act.startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))
                          "ব্লুটুথ সেটিংস খুলেছি, সেখান থেকে অন/অফ করুন।"
                      } catch (e: Exception) {
                          "ব্লুটুথ সেটিংস খোলা গেল না।"
                      }
                  }

                  // অ্যাপ খোলা
                  if (has(t, "খোল", "খুল", "open", "ওপেন", "চালু কর", "launch", "চালাও")) {
                      openApp(t)?.let { return it }
                  }

                  return null
              }

              private fun torch(on: Boolean): String {
                  return try {
                      val cm = act.getSystemService(CameraManager::class.java)
                      val id = cm.cameraIdList.firstOrNull {
                          cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      } ?: return "এই ফোনে ফ্ল্যাশ পাওয়া গেল না।"
                      cm.setTorchMode(id, on)
                      torchOn = on
                      if (on) "টর্চ জ্বালালাম।" else "টর্চ বন্ধ করলাম।"
                  } catch (e: Exception) {
                      "টর্চ চালানো গেল না: ${e.message}"
                  }
              }

              private fun brightness(pct: Int): String {
                  if (!Settings.System.canWrite(act)) {
                      try {
                          act.startActivity(
                              Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + act.packageName))
                          )
                      } catch (_: Exception) {
                      }
                      return "সেটিংস পরিবর্তনের অনুমতি দিন (খোলা পেজে অ্যাপটি অন করুন), তারপর আবার বলুন।"
                  }
                  return try {
                      val cr = act.contentResolver
                      Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL)
                      Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS, Math.round(pct * 255 / 100f))
                      "ব্রাইটনেস $pct% করলাম।"
                  } catch (e: Exception) {
                      "ব্রাইটনেস বদলানো গেল না: ${e.message}"
                  }
              }

              private fun setAlarm(h: Int, m: Int): String {
                  fun intent(skip: Boolean) = Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, h)
                      .putExtra(AlarmClock.EXTRA_MINUTES, m)
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, skip)
                  return try {
                      act.startActivity(intent(true))
                      "অ্যালার্ম সেট করলাম %02d:%02d-এ।".format(h, m)
                  } catch (e: Exception) {
                      try {
                          act.startActivity(intent(false))
                          "ঘড়ি অ্যাপ খুলেছি %02d:%02d দিয়ে। শুধু সেভ চাপুন।".format(h, m)
                      } catch (e2: Exception) {
                          "অ্যালার্ম সেট করা গেল না: ${e2.message}"
                      }
                  }
              }

              private fun setTimer(secs: Int): String {
                  fun intent(skip: Boolean) = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, secs)
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, skip)
                  return try {
                      act.startActivity(intent(true))
                      "টাইমার চালু করলাম ($secs সেকেন্ড)।"
                  } catch (e: Exception) {
                      try {
                          act.startActivity(intent(false))
                          "ঘড়ি অ্যাপে টাইমার তৈরি করেছি, স্টার্ট চাপুন।"
                      } catch (e2: Exception) {
                          "টাইমার দেওয়া গেল না: ${e2.message}"
                      }
                  }
              }

              private fun findContact(t: String): Pair<String, String>? {
                  try {
                      act.contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(
                              ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                              ContactsContract.CommonDataKinds.Phone.NUMBER
                          ),
                          null, null, null
                      )?.use { c ->
                          while (c.moveToNext()) {
                              val name = c.getString(0) ?: continue
                              val num = c.getString(1) ?: continue
                              if (name.length >= 2 && t.contains(name.lowercase())) return name to num
                          }
                      }
                  } catch (_: Exception) {
                  }
                  return null
              }

              private fun call(who: String, number: String): String {
                  if (!need(Manifest.permission.CALL_PHONE)) return "কল করার পারমিশন দিন, তারপর আবার বলুন।"
                  return try {
                      act.startActivity(Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(number))))
                      "$who-কে কল করছি।"
                  } catch (e: Exception) {
                      "কল করা গেল না: ${e.message}"
                  }
              }

              private fun sendSms(number: String, body: String): String {
                  if (!need(Manifest.permission.SEND_SMS)) return "এসএমএস পাঠানোর পারমিশন দিন, তারপর আবার বলুন।"
                  return try {
                      val sms = act.getSystemService(SmsManager::class.java)
                      sms.sendMultipartTextMessage(number, null, sms.divideMessage(body), null, null)
                      "মেসেজ পাঠালাম।"
                  } catch (e: Exception) {
                      "মেসেজ যায়নি: ${e.message}"
                  }
              }

              private fun openApp(t0: String): String? {
                  var t = t0
                  for ((bn, en) in aliases) t = t.replace(bn, en)
                  val pm = act.packageManager
                  val list = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                  )
                  var bestLabel = ""
                  var bestPkg: String? = null
                  for (ri in list) {
                      val l = ri.loadLabel(pm).toString().lowercase()
                      if (l.length >= 2 && (t.contains(l) || t0.contains(l)) && l.length > bestLabel.length) {
                          bestLabel = l
                          bestPkg = ri.activityInfo.packageName
                      }
                  }
                  val pkg = bestPkg ?: return null
                  val launch = pm.getLaunchIntentForPackage(pkg) ?: return null
                  return try {
                      act.startActivity(launch)
                      "$bestLabel খুলছি।"
                  } catch (e: Exception) {
                      "অ্যাপ খোলা গেল না: ${e.message}"
                  }
              }
          }
