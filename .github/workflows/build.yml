      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build APK
        shell: bash
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          echo '### Build errors' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |What went wrong|Execution failed|Could not |error:' build.log | cut -c1-300 | head -40 >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: MunnaAI-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MunnaAI.apk
          gh release create "v${{ github.run_number }}" MunnaAI.apk --repo "${{ github.repository }}" --title "Munna AI v${{ github.run_number }}" --notes "Download MunnaAI.apk and install it on your phone."
