          __EOF__
          mkdir -p 'app/src/main/java/com/personal/ai'
          cat > 'app/src/main/java/com/personal/ai/Llm.kt' <<'__EOF__'
          package com.personal.ai

          import android.content.Context
          import com.google.ai.edge.litertlm.Backend
          import com.google.ai.edge.litertlm.Contents
          import com.google.ai.edge.litertlm.ConversationConfig
          import com.google.ai.edge.litertlm.Engine
          import com.google.ai.edge.litertlm.EngineConfig
          import kotlinx.coroutines.flow.Flow
          import kotlinx.coroutines.flow.map
          import java.io.File

          /** অফলাইন মডেল (LiteRT-LM) সামলায়। */
          class Llm(private val ctx: Context) {
              private var engine: Engine? = null
              private var sender: ((String) -> Flow<String>)? = null
              private var pendingSystem: String? = null
              private var closer: (() -> Unit)? = null

              var backendName: String = ""
                  private set

              val modelFile: File get() = File(ctx.filesDir, "model.litertlm")
              val ready: Boolean get() = sender != null

              /** preferred: "GPU" বা "CPU"। CPU বেছে নিলে শুধু CPU, GPU বেছে নিলে ব্যর্থ হলে CPU। */
              fun load(system: String, preferred: String) {
                  close()
                  val order = if (preferred == "CPU") listOf("CPU") else listOf("GPU", "CPU")
                  var last: Throwable? = null
                  for (name in order) {
                      try {
                          val backend = if (name == "GPU") Backend.GPU() else Backend.CPU()
                          val e = Engine(EngineConfig(modelPath = modelFile.absolutePath, backend = backend))
                          try {
                              e.initialize()
                          } catch (t: Throwable) {
                              try { e.close() } catch (_: Throwable) {}
                              throw t
                          }
                          engine = e
                          backendName = name
                          newConversation(system)
                          return
                      } catch (t: Throwable) {
                          last = t
                      }
                  }
                  throw last ?: IllegalStateException("মডেল লোড হয়নি")
              }

              fun newConversation(system: String) {
                  val e = engine ?: return
                  try { closer?.invoke() } catch (_: Throwable) {}
                  val conv = e.createConversation()
                  pendingSystem = system
                  sender = { msg -> conv.sendMessageAsync(msg).map { it.toString() } }
                  closer = { conv.close() }
              }

              fun ask(msg: String): Flow<String> {
                  val s = pendingSystem
                  pendingSystem = null
                  val full = if (s != null) "[নির্দেশনা]\n$s\n\n[ব্যবহারকারীর কথা]\n$msg" else msg
                  return sender!!.invoke(full)
              }

              fun close() {
                  try { closer?.invoke() } catch (_: Throwable) {}
                  try { engine?.close() } catch (_: Throwable) {}
                  closer = null
                  sender = null
                  engine = null
              }
          }
          __EOF__
          mkdir -p 'app/src/main/java/com/personal/ai'
          cat > 'app/src/main/java/com/personal/ai/MainActivity.kt' <<'__EOF__'
          package com.personal.ai

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.Menu
          import android.view.MenuItem
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.flow.flowOn
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.time.LocalDateTime
          import java.time.format.DateTimeFormatter
          import java.util.Locale

          class MainActivity : Activity() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private lateinit var chat: LinearLayout
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText
              private lateinit var llm: Llm
              private lateinit var phone: PhoneControl
              private val prefs by lazy { getSharedPreferences("ai", MODE_PRIVATE) }

              private var tts: TextToSpeech? = null
              private var speak = false
              private var busy = false

              private val url4b =
                  "https://huggingface.co/litert-community/Qwen3-4B-Instruct-2507/resolve/main/qwen3_4b_instruct_2507_mixed_int4.litertlm"
              private val url06b =
                  "https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/qwen3_0_6b_mixed_int4.litertlm"
              private val reqSpeech = 21
              private val reqFile = 22

              // ------------------------------------------------------------ শুরু
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  title = "মুন্না এআই"
                  llm = Llm(this)
                  phone = PhoneControl(this)
                  buildUi()

                  tts = TextToSpeech(this) { st ->
                      if (st == TextToSpeech.SUCCESS) tts?.language = Locale("bn", "BD")
                  }

                  val missing = listOf(
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.SEND_SMS
                  ).filter { checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED }
                  if (missing.isNotEmpty()) requestPermissions(missing.toTypedArray(), 1)

                  // আগেরবার মডেল চালু করতে গিয়ে অ্যাপ ক্র্যাশ করলে অন্য ব্যাকএন্ড চেষ্টা
                  if (prefs.getBoolean("loading", false)) {
                      val cur = prefs.getString("backend", "CPU") ?: "CPU"
                      val next = if (cur == "GPU") "CPU" else "GPU"
                      prefs.edit().putString("backend", next).putBoolean("loading", false).apply()
                      bubble("আগেরবার মডেল চালু করতে অ্যাপ বন্ধ হয়ে গিয়েছিল, এবার ${next} দিয়ে চেষ্টা করছি।", false)
                  }

                  if (phone.name().isBlank()) {
                      val et = EditText(this).apply { hint = "আপনার নাম" }
                      AlertDialog.Builder(this)
                          .setTitle("আপনার নাম কী?")
                          .setView(et)
                          .setCancelable(false)
                          .setPositiveButton("ঠিক আছে") { _, _ ->
                              phone.setName(et.text.toString().trim().ifBlank { "বন্ধু" })
                              startFlow()
                          }
                          .show()
                  } else {
                      startFlow()
                  }
                  handleLaunch(intent)
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleLaunch(intent)
              }

              /** অ্যাসিস্ট্যান্ট বা ভয়েস কমান্ড থেকে খুললে সঙ্গে সঙ্গে মাইক চালু। */
              private fun handleLaunch(i: Intent?) {
                  if (i == null) return
                  val wants = i.getBooleanExtra("listen", false) ||
                      i.action == Intent.ACTION_ASSIST ||
                      i.action == Intent.ACTION_VOICE_COMMAND
                  if (!wants) return
                  i.removeExtra("listen")
                  i.action = Intent.ACTION_MAIN
                  input.postDelayed({ listen() }, 500)
              }

              private fun startFlow() {
                  bubble("হ্যালো ${phone.name()}! 'সাহায্য' লিখলে কমান্ডের তালিকা পাবেন। ফোন কমান্ড এখনই কাজ করবে।", false)
                  if (llm.modelFile.exists()) {
                      loadModel()
                  } else {
                      bubble("চ্যাটের জন্য একটা অফলাইন মডেল দরকার। বেছে নিন:", false)
                      chooseModel()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
                  llm.close()
                  tts?.shutdown()
              }

              // ------------------------------------------------------------ UI
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xFFF2F3F7.toInt())
                  }
                  scroll = ScrollView(this)
                  chat = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }
                  scroll.addView(chat)
                  root.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(8), dp(6), dp(8), dp(6))
                      setBackgroundColor(Color.WHITE)
                  }
                  val mic = Button(this).apply {
                      text = "🎤"
                      setOnClickListener { listen() }
                  }
                  input = EditText(this).apply {
                      hint = "কিছু বলুন বা লিখুন..."
                      maxLines = 4
                  }
                  val send = Button(this).apply {
                      text = "পাঠান"
                      setOnClickListener {
                          val t = input.text.toString().trim()
                          if (t.isNotEmpty()) {
                              input.setText("")
                              onSend(t)
                          }
                      }
                  }
                  bar.addView(mic, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  bar.addView(input, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  bar.addView(send, LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  root.addView(bar, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  setContentView(root)
              }

              private fun bubble(text: String, user: Boolean): TextView {
                  val tv = TextView(this).apply {
                      setText(text)
                      textSize = 16f
                      setTextColor(if (user) Color.WHITE else 0xFF1B1B1F.toInt())
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(18).toFloat()
                          setColor(if (user) 0xFF3B6FD4.toInt() else Color.WHITE)
                      }
                      setTextIsSelectable(true)
                      maxWidth = (resources.displayMetrics.widthPixels * 0.85).toInt()
                  }
                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      topMargin = dp(6)
                      gravity = if (user) Gravity.END else Gravity.START
                  }
                  chat.addView(tv, lp)
                  scrollDown()
                  return tv
              }

              private fun scrollDown() {
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()

              // ------------------------------------------------------------ মেনু
              override fun onCreateOptionsMenu(menu: Menu): Boolean {
                  menu.add(0, 1, 0, "নতুন চ্যাট")
                  menu.add(0, 2, 0, "মডেল নামান / বদলান")
                  menu.add(0, 3, 0, "ফোনের ফাইল থেকে মডেল")
                  menu.add(0, 4, 0, "কথা বলে উত্তর চালু/বন্ধ")
                  menu.add(0, 5, 0, "CPU/GPU বদলান")
                  menu.add(0, 6, 0, "আমার নোট দেখুন")
                  menu.add(0, 7, 0, "সব নোট মুছুন")
                  menu.add(0, 8, 0, "সাহায্য")
                  return true
              }

              override fun onOptionsItemSelected(item: MenuItem): Boolean {
                  when (item.itemId) {
                      1 -> {
                          chat.removeAllViews()
                          refreshConversation()
                          bubble("নতুন চ্যাট শুরু হলো।", false)
                      }
                      2 -> chooseModel()
                      3 -> pickFile()
                      4 -> {
                          speak = !speak
                          toast(if (speak) "এখন থেকে উত্তর বলে শোনাব" else "বলা বন্ধ")
                      }
                      5 -> {
                          val cur = prefs.getString("backend", "CPU") ?: "CPU"
                          val next = if (cur == "GPU") "CPU" else "GPU"
                          prefs.edit().putString("backend", next).apply()
                          bubble("পরের বার মডেল ${next} দিয়ে চালু হবে। এখনই চালু করছি...", false)
                          if (llm.modelFile.exists() && !busy) loadModel()
                      }
                      6 -> {
                          val n = phone.notes()
                          bubble(if (n.isEmpty()) "এখনো কিছু মনে রাখিনি।" else n.joinToString("\n") { "• $it" }, false)
                      }
                      7 -> {
                          phone.clearNotes()
                          refreshConversation()
                          bubble("সব নোট মুছে ফেললাম।", false)
                      }
                      8 -> bubble(phone.help, false)
                  }
                  return true
              }

              // ------------------------------------------------------------ কথোপকথন
              private fun systemPrompt(): String {
                  val notes = phone.notes().joinToString("\n") { "- $it" }.ifEmpty { "(কিছু নেই)" }
                  val now = LocalDateTime.now().format(DateTimeFormatter.ofPattern("dd-MM-yyyy HH:mm"))
                  val who = phone.name().ifBlank { "ব্যবহারকারী" }
                  return "তোমার নাম মুন্না এআই। তুমি ${who}-এর ব্যক্তিগত এআই সহকারী। এখন সময়: ${now}।\n" +
                      "ব্যবহারকারী যে ভাষায় লেখে সেই ভাষায় (বাংলা হলে বাংলায়) ছোট ও পরিষ্কার উত্তর দাও। " +
                      "না জানলে বানিয়ে বলো না, স্বীকার করো।\n" +
                      "ব্যবহারকারী সম্পর্কে যা মনে রাখতে বলেছে:\n$notes"
              }

              private fun refreshConversation() {
                  if (!llm.ready || busy) return
                  scope.launch(Dispatchers.IO) {
                      try {
                          llm.newConversation(systemPrompt())
                      } catch (_: Throwable) {
                      }
                  }
              }

              private fun cleanThink(s: String): String {
                  var r = s.replace(Regex("<think>.*?</think>", RegexOption.DOT_MATCHES_ALL), "")
                  val i = r.indexOf("<think>")
                  if (i >= 0) r = r.substring(0, i)
                  return r.trim().ifEmpty { "…" }
              }

              private fun speakOut(s: String) {
                  if (speak && s.isNotBlank()) tts?.speak(s.take(400), TextToSpeech.QUEUE_FLUSH, null, "ai")
              }

              private fun onSend(text: String) {
                  bubble(text, true)

                  // ১) ফোন কমান্ড (মডেল ছাড়াই, অফলাইনে)
                  val r = phone.handle(text)
                  if (r != null) {
                      bubble(r, false)
                      speakOut(r)
                      if (phone.notesChanged) {
                          phone.notesChanged = false
                          refreshConversation()
                      }
                      return
                  }

                  // ২) সাধারণ প্রশ্ন -> মডেল (দরকার হলে ইন্টারনেট থেকে তথ্য নিয়ে)
                  if (busy) {
                      bubble("একটু অপেক্ষা করুন, আগের কাজ চলছে।", false)
                      return
                  }
                  if (!llm.ready) {
                      bubble("মডেল এখনো প্রস্তুত নয়। ফোন কমান্ড কাজ করবে; চ্যাটের জন্য মেনু থেকে মডেল নামান।", false)
                      return
                  }
                  busy = true
                  scope.launch {
                      try {
                          var prompt = text
                          if (Web.wantsWeb(text)) {
                              if (Web.isOnline(this@MainActivity)) {
                                  val note = bubble("🌐 ইন্টারনেটে খুঁজছি...", false)
                                  val ctx = withContext(Dispatchers.IO) {
                                      try {
                                          Web.search(Web.stripPrefix(text).ifBlank { text })
                                      } catch (e: Exception) {
                                          ""
                                      }
                                  }
                                  chat.removeView(note)
                                  if (ctx.isNotBlank()) {
                                      prompt = "ইন্টারনেট থেকে পাওয়া তথ্য:\n$ctx\n\nপ্রশ্ন: $text\n" +
                                          "উপরের তথ্য ব্যবহার করে সংক্ষেপে উত্তর দাও।"
                                  }
                              } else {
                                  bubble("(ইন্টারনেট নেই, অফলাইন জ্ঞান থেকে বলছি। তথ্য পুরনো হতে পারে)", false)
                              }
                          }
                          val out = bubble("…", false)
                          var acc = ""
                          try {
                              llm.ask(prompt).flowOn(Dispatchers.Default).collect {
                                  acc += it
                                  out.text = cleanThink(acc)
                                  scrollDown()
                              }
                          } catch (e: Throwable) {
                              out.text = "ত্রুটি: ${e.message}"
                          }
                          speakOut(out.text.toString())
                      } finally {
                          busy = false
                      }
                  }
              }

              // ------------------------------------------------------------ ভয়েস ইনপুট
              private fun listen() {
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                      .putExtra(RecognizerIntent.EXTRA_PROMPT, "বলুন...")
                  try {
                      startActivityForResult(i, reqSpeech)
                  } catch (e: Exception) {
                      toast("ভয়েস ইনপুট পাওয়া গেল না। Google অ্যাপ আপডেট আছে কি দেখুন।")
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (resultCode != RESULT_OK || data == null) return
                  when (requestCode) {
                      reqSpeech -> data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                          ?.firstOrNull()?.let { onSend(it) }
                      reqFile -> data.data?.let { copyModel(it) }
                  }
              }

              // ------------------------------------------------------------ মডেল ম্যানেজমেন্ট
              private fun chooseModel() {
                  AlertDialog.Builder(this)
                      .setTitle("মডেল বেছে নিন")
                      .setItems(
                          arrayOf(
                              "ভালো মডেল (Qwen3 4B, প্রায় 2.5 GB)",
                              "ছোট ও দ্রুত (Qwen3 0.6B, প্রায় 0.5 GB)",
                              "ফোনের ফাইল থেকে (.litertlm)"
                          )
                      ) { _, which ->
                          when (which) {
                              0 -> startDownload(url4b)
                              1 -> startDownload(url06b)
                              2 -> pickFile()
                          }
                      }
                      .show()
              }

              private fun pickFile() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      .addCategory(Intent.CATEGORY_OPENABLE)
                      .setType("*/*")
                  try {
                      startActivityForResult(i, reqFile)
                  } catch (e: Exception) {
                      toast("ফাইল বাছাই খোলা গেল না")
                  }
              }

              private fun startDownload(url: String) {
                  if (busy) {
                      toast("আগের কাজ চলছে")
                      return
                  }
                  val tv = bubble("মডেল নামানো শুরু... অ্যাপ খোলা রেখে ওয়াই-ফাইতে অপেক্ষা করুন।", false)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  busy = true
                  scope.launch {
                      val err = withContext(Dispatchers.IO) {
                          try {
                              download(url) { msg -> runOnUiThread { tv.text = msg } }
                              null
                          } catch (e: Exception) {
                              e.message ?: e.toString()
                          }
                      }
                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      busy = false
                      if (err == null) {
                          tv.text = "মডেল নামানো শেষ।"
                          loadModel()
                      } else {
                          tv.text = "নামানো যায়নি: $err\n(নেট ঠিক হলে মেনু থেকে আবার চাপুন, যেখানে থেমেছিল সেখান থেকে চলবে। অথবা ফোনের ফাইল থেকে মডেল দিন।)"
                      }
                  }
              }

              private fun download(url: String, progress: (String) -> Unit) {
                  val part = File(filesDir, "model.part")
                  if (prefs.getString("dl_url", "") != url) part.delete()
                  prefs.edit().putString("dl_url", url).apply()
                  val have = if (part.exists()) part.length() else 0L

                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.connectTimeout = 15000
                  conn.readTimeout = 30000
                  if (have > 0) conn.setRequestProperty("Range", "bytes=$have-")
                  conn.connect()
                  val code = conn.responseCode
                  if (code == 416) {
                      llm.close()
                      llm.modelFile.delete()
                      part.renameTo(llm.modelFile)
                      return
                  }
                  if (code != 200 && code != 206) {
                      val extra = if (code == 401 || code == 403) " (এই মডেল নামাতে লগইন লাগছে, ফোনের ফাইল থেকে দিন)" else ""
                      throw IOException("সার্ভার উত্তর: $code$extra")
                  }
                  val append = code == 206
                  var done = if (append) have else 0L
                  val total = conn.contentLengthLong + (if (append) have else 0L)
                  var last = 0L
                  val buf = ByteArray(256 * 1024)
                  FileOutputStream(part, append).use { out ->
                      conn.inputStream.use { inp ->
                          while (true) {
                              val n = inp.read(buf)
                              if (n < 0) break
                              out.write(buf, 0, n)
                              done += n
                              val now = System.currentTimeMillis()
                              if (now - last > 700) {
                                  last = now
                                  val pct = if (total > 0) done * 100 / total else 0
                                  progress("মডেল নামছে: ${done / 1048576} MB / ${total / 1048576} MB ($pct%)")
                              }
                          }
                      }
                  }
                  llm.close()
                  llm.modelFile.delete()
                  if (!part.renameTo(llm.modelFile)) throw IOException("ফাইল সেভ করা যায়নি")
              }

              private fun copyModel(uri: Uri) {
                  if (busy) {
                      toast("আগের কাজ চলছে")
                      return
                  }
                  val tv = bubble("ফাইল কপি হচ্ছে...", false)
                  busy = true
                  scope.launch {
                      val err = withContext(Dispatchers.IO) {
                          try {
                              llm.close()
                              val part = File(filesDir, "model.part")
                              var done = 0L
                              var last = 0L
                              contentResolver.openInputStream(uri)!!.use { inp ->
                                  FileOutputStream(part).use { out ->
                                      val buf = ByteArray(256 * 1024)
                                      while (true) {
                                          val n = inp.read(buf)
                                          if (n < 0) break
                                          out.write(buf, 0, n)
                                          done += n
                                          val now = System.currentTimeMillis()
                                          if (now - last > 700) {
                                              last = now
                                              runOnUiThread { tv.text = "কপি হচ্ছে: ${done / 1048576} MB" }
                                          }
                                      }
                                  }
                              }
                              llm.modelFile.delete()
                              if (!part.renameTo(llm.modelFile)) throw IOException("ফাইল সেভ করা যায়নি")
                              null
                          } catch (e: Exception) {
                              e.message ?: e.toString()
                          }
                      }
                      busy = false
                      if (err == null) {
                          tv.text = "ফাইল কপি শেষ।"
                          loadModel()
                      } else {
                          tv.text = "কপি করা যায়নি: $err"
                      }
                  }
              }

              private fun loadModel() {
                  if (busy) return
                  val tv = bubble("মডেল লোড হচ্ছে... (প্রথমবার ২০-৩০ সেকেন্ড লাগতে পারে)", false)
                  busy = true
                  prefs.edit().putBoolean("loading", true).apply()
                  val backend = prefs.getString("backend", "CPU") ?: "CPU"
                  scope.launch {
                      val err = withContext(Dispatchers.IO) {
                          try {
                              llm.load(systemPrompt(), backend)
                              null
                          } catch (t: Throwable) {
                              t.message ?: t.toString()
                          }
                      }
                      prefs.edit().putBoolean("loading", false).apply()
                      busy = false
                      tv.text = if (err == null) {
                          "প্রস্তুত! (${llm.backendName}) যেকোনো প্রশ্ন করুন, বাংলা বা ইংরেজিতে।"
                      } else {
                          "মডেল চালু হয়নি: $err\nমেনু থেকে 'CPU/GPU বদলান' বা ছোট মডেল (0.6B) চেষ্টা করুন। ফোন কমান্ড তবু কাজ করবে।"
                      }
                  }
              }
          }
