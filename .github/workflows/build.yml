          package com.personal.ai

          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.service.voice.VoiceInteractionService
          import android.service.voice.VoiceInteractionSession
          import android.service.voice.VoiceInteractionSessionService

          /** ফোনের "ডিফল্ট ডিজিটাল অ্যাসিস্ট্যান্ট" হিসেবে বেছে নেওয়ার জন্য। */
          class AssistService : VoiceInteractionService()

          class AssistSessionService : VoiceInteractionSessionService() {
              override fun onNewSession(args: Bundle?): VoiceInteractionSession = AssistSession(this)
          }

          class AssistSession(ctx: Context) : VoiceInteractionSession(ctx) {
              override fun onShow(args: Bundle?, showFlags: Int) {
                  super.onShow(args, showFlags)
                  val i = Intent(context, MainActivity::class.java).putExtra("listen", true)
                  try {
                      startAssistantActivity(i)
                  } catch (e: Exception) {
                      try {
                          context.startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      } catch (_: Exception) {
                      }
                  }
                  hide()
              }
          }

          /** অ্যাসিস্ট্যান্ট হিসেবে রেজিস্টার করতে একটা খালি রিকগনিশন সার্ভিস লাগে। */
          class StubRecognitionService : android.speech.RecognitionService() {
              override fun onStartListening(recognizerIntent: Intent?, listener: android.speech.RecognitionService.Callback?) {}
              override fun onCancel(listener: android.speech.RecognitionService.Callback?) {}
              override fun onStopListening(listener: android.speech.RecognitionService.Callback?) {}
          }
